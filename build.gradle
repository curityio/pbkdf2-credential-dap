plugins {
    id 'java'
}

group = 'io.curity.identityserver.plugin'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'se.curity.identityserver:identityserver.sdk:11.0.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.12'
}
